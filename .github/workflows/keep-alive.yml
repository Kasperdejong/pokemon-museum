name: Keep Supabase Alive

on:
  schedule:
    # Runs every 4 days at 00:00 UTC (well before the 7-day limit)
    - cron: "0 0 */4 * *"
  workflow_dispatch: # Allows you to manually trigger it from GitHub to test

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          curl --fail --show-error \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/submissions?select=id&limit=1"
